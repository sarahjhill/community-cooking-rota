{% extends "base.html" %}

{% block title %}Delete rota &mdash; Community Cooking Rota{% endblock %}

{% block content %}
  <h1>Delete this rota?</h1>

  <div class="card">
    <p>
      This will permanently delete the rota for <strong>{{ rota.recipient_name }}</strong>
      and every date in it. This cannot be undone.
    </p>
    <form method="post">
      {% csrf_token %}
      <button class="btn" type="submit">Yes, delete it</button>
      <a class="btn btn-small" href="{% url 'rota:rota_detail' rota.pk %}">Cancel</a>
    </form>
  </div>
{% endblock %}
